<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password · Reset your password</title>
  <!-- Google Font & simple CSS reset -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(145deg, #f5f7ff 0%, #eef1fa 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      line-height: 1.5;
      color: #1a1e2b;
    }

    /* main card */
    .reset-card {
      background-color: #ffffff;
      max-width: 460px;
      width: 100%;
      border-radius: 2rem;
      box-shadow: 0 20px 35px -8px rgba(0, 20, 50, 0.12), 0 8px 18px -6px rgba(0, 0, 0, 0.05);
      padding: 2.5rem 2rem 2.5rem 2rem;
      transition: transform 0.2s ease;
    }

    .reset-card:hover {
      box-shadow: 0 25px 40px -12px rgba(0, 30, 70, 0.18);
    }

    /* header */
    .icon-circle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #eef3fe;
      width: 3.5rem;
      height: 3.5rem;
      border-radius: 1.2rem;
      margin-bottom: 1.5rem;
      color: #1e4bd2;
    }

    .icon-circle svg {
      width: 1.8rem;
      height: 1.8rem;
      stroke-width: 1.8;
    }

    h1 {
      font-size: 1.85rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #0b1220;
      margin-bottom: 0.6rem;
    }

    .subhead {
      font-size: 0.98rem;
      color: #4f5a6b;
      margin-bottom: 2rem;
      font-weight: 400;
    }

    /* form */
    .form-group {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 500;
      color: #1e2636;
      margin-bottom: 0.45rem;
      letter-spacing: -0.01em;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper svg {
      position: absolute;
      left: 1rem;
      width: 1.2rem;
      height: 1.2rem;
      color: #7a8699;
      pointer-events: none;
      transition: color 0.15s;
    }

    input[type="email"] {
      width: 100%;
      padding: 0.9rem 1rem 0.9rem 2.9rem;
      font-size: 0.98rem;
      font-family: 'Inter', sans-serif;
      border: 1.5px solid #dfe4ed;
      border-radius: 1rem;
      background: #fafbff;
      outline: none;
      transition: border 0.2s, box-shadow 0.2s, background 0.15s;
      color: #0f172a;
      font-weight: 400;
    }

    input[type="email"]:focus {
      border-color: #1e4bd2;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(30, 75, 210, 0.12);
    }

    input[type="email"]:focus + svg {
      color: #1e4bd2;
    }

    input[type="email"]::placeholder {
      color: #a2adc0;
      font-weight: 400;
    }

    /* button */
    .btn-primary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      background: #1e4bd2;
      border: none;
      color: white;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 1rem;
      padding: 0.9rem 1.5rem;
      border-radius: 1rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 6px 14px -4px rgba(30, 75, 210, 0.35);
      margin-bottom: 1.4rem;
      letter-spacing: -0.01em;
    }

    .btn-primary:hover {
      background: #133db8;
      box-shadow: 0 10px 18px -6px rgba(30, 75, 210, 0.45);
    }

    .btn-primary:active {
      transform: scale(0.98);
      background: #0f349e;
      box-shadow: 0 4px 10px -3px rgba(30, 75, 210, 0.4);
    }

    .btn-primary svg {
      width: 1.1rem;
      height: 1.1rem;
    }

    /* message / feedback */
    .feedback {
      font-size: 0.88rem;
      padding: 0.75rem 1rem;
      border-radius: 0.9rem;
      margin: 1rem 0 0.5rem;
      display: none;
      align-items: center;
      gap: 0.5rem;
      font-weight: 500;
    }

    .feedback.success {
      display: flex;
      background: #e3f5ea;
      color: #0a6b3c;
      border-left: 4px solid #17a45c;
    }

    .feedback.error {
      display: flex;
      background: #fef0f0;
      color: #b3261e;
      border-left: 4px solid #d93b2b;
    }

    .feedback svg {
      width: 1.2rem;
      height: 1.2rem;
      flex-shrink: 0;
    }

    /* back to sign in */
    .back-link {
      text-align: center;
      margin-top: 1.8rem;
      font-size: 0.95rem;
      color: #4f5a6b;
      border-top: 1px solid #e7ecf5;
      padding-top: 1.6rem;
    }

    .back-link a {
      color: #1e4bd2;
      font-weight: 500;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      transition: color 0.15s;
    }

    .back-link a:hover {
      color: #0f349e;
      text-decoration: underline;
    }

    .back-link svg {
      width: 1rem;
      height: 1rem;
    }

    /* helper for empty state (dev) */
    .note {
      font-size: 0.78rem;
      color: #8896aa;
      text-align: center;
      margin-top: 1.2rem;
      opacity: 0.8;
    }

    /* subtle focus visible outline for accessibility */
    .btn-primary:focus-visible,
    .back-link a:focus-visible,
    input:focus-visible {
      outline: 2px solid #1e4bd2;
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <div class="reset-card">
    <!-- icon -->
    <div class="icon-circle" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 12v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v2" />
        <circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none" />
        <path d="M18 10v4" />
        <path d="M20 12h-4" />
      </svg>
    </div>

    <h1>Forgot password?</h1>
    <p class="subhead">No worries, we'll send you reset instructions.</p>

    <!-- main form -->
    <form id="resetForm" action="#" method="post" novalidate>
      <div class="form-group">
        <label for="email">Email address</label>
        <div class="input-wrapper">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5" width="18" height="14" rx="2" ry="2"></rect>
            <polyline points="3 7 12 13 21 7"></polyline>
          </svg>
          <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
        </div>
      </div>

      <button type="submit" class="btn-primary" id="resetBtn">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
        Send reset link
      </button>

      <!-- dynamic feedback message (hidden by default) -->
      <div id="feedbackMessage" class="feedback" role="alert" aria-live="polite">
        <!-- filled via JS -->
      </div>
    </form>

    <!-- back to login -->
    <div class="back-link">
      <a href="#" id="backToLogin">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Back to sign in
      </a>
    </div>

    <!-- subtle hint (for demo / production can be removed) -->
    <div class="note">Demo — no real email is sent.</div>
  </div>

  <script>
    (function() {
      const form = document.getElementById('resetForm');
      const emailInput = document.getElementById('email');
      const feedback = document.getElementById('feedbackMessage');
      const backLink = document.getElementById('backToLogin');

      // Helper to set feedback message with icon
      function setFeedback(type, message) {
        // clear previous content and classes
        feedback.className = 'feedback';
        feedback.innerHTML = '';

        // create icon element based on type
        let iconSvg = '';
        if (type === 'success') {
          iconSvg = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>`;
        } else if (type === 'error') {
          iconSvg = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>`;
        }

        feedback.innerHTML = iconSvg + `<span>${message}</span>`;
        feedback.classList.add(type);
      }

      // Real-time validation helper
      function validateEmail(email) {
        if (!email.trim()) {
          return 'Please enter your email address.';
        }
        // simple pattern: text@domain.tld
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email.trim())) {
          return 'Enter a valid email address (e.g., name@domain.com).';
        }
        return null;
      }

      // Clear feedback when user starts typing again
      emailInput.addEventListener('input', function() {
        if (feedback.classList.contains('success') || feedback.classList.contains('error')) {
          feedback.className = 'feedback';
          feedback.innerHTML = '';
        }
      });

      // handle form submission
      form.addEventListener('submit', function(event) {
        event.preventDefault(); // no page reload

        const email = emailInput.value.trim();
        const validationError = validateEmail(email);

        if (validationError) {
          setFeedback('error', validationError);
          emailInput.focus();
          return;
        }

        // Simulate a successful "reset link sent"
        // In a real app, you would make an API call here.
        setFeedback('success', `If an account exists for ${email}, a reset link will be sent.`);

        // (optional) clear the input field after success – nice UX
        emailInput.value = '';

        // we don't clear feedback so the user sees the confirmation.
        // but we can blur input if needed
        emailInput.blur();

        // Optionally, for demo, you could console.log the email.
        // console.log(`Password reset requested for: ${email}`);
      });

      // "Back to sign in" – simply show a friendly message (in real app, redirect)
      backLink.addEventListener('click', function(event) {
        event.preventDefault();
        // Show a temporary feedback instead of redirect (since it's a demo)
        // In production, replace with: window.location.href = '/login';
        setFeedback('success', 'Redirecting to sign in page… (demo)');
        // Clear feedback after 3 seconds
        setTimeout(() => {
          feedback.className = 'feedback';
          feedback.innerHTML = '';
        }, 3000);
      });

      // "silence" any other link clicks inside the card (just in case)
      // also set proper autocomplete and a11y.
      // but the rest is fine.
    })();
  </script>
</body>
</html>
